# Üretim ortamı: tek sunucuda (VPS) Caddy + uygulama + PostgreSQL.
#
#   cp .env.example .env    # değerleri doldur
#   docker compose -f docker-compose.prod.yml up -d
#
# Dışarıya yalnızca Caddy açılır (80/443); Caddy, Let's Encrypt ile HTTPS sertifikasını
# kendisi alır ve yeniler. Uygulama ve veritabanı yalnızca iç ağda görünür.
name: portfolio

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN tanımlanmalı}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  web:
    # CI'ın GHCR'ye yayımladığı imaj; yerelde derlemek için "image" yerine "build" kullanılabilir.
    image: ${IMAGE:?IMAGE tanımlanmalı, ör. ghcr.io/kullanici/portfolio:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=portfolio;Username=portfolio;Password=${POSTGRES_PASSWORD:?}"
      Seed__AdminEmail: ${ADMIN_EMAIL:?}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?}
      Analytics__Secret: ${ANALYTICS_SECRET:?}
      DataProtection__KeysPath: /app/keys
      Email__SmtpHost: ${SMTP_HOST:-}
      Email__SmtpPort: ${SMTP_PORT:-587}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM:-}
      Contact__NotifyEmail: ${NOTIFY_EMAIL:-}
      GitHub__Token: ${GITHUB_TOKEN:-}
    volumes:
      - uploads:/app/wwwroot/uploads
      - keys:/app/keys

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımlanmalı}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  uploads:
  keys:
  caddy_data:
  caddy_config:
