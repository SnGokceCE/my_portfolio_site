# Geliştirme:  docker compose up -d db mail (veritabanı + e-posta test sunucusu; uygulamayı `dotnet run` ile çalıştır)
# Tam yığın:   docker compose --profile full up --build  (tüm servisler, site: http://localhost:8080)
name: portfolio

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Geliştirme için sahte SMTP sunucusu: giden e-postaları http://localhost:8025 adresinde gösterir.
  mail:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    build:
      context: .
      dockerfile: src/Portfolio.Web/Dockerfile
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=portfolio;Username=portfolio;Password=${POSTGRES_PASSWORD:-portfolio_dev}"
      Seed__AdminEmail: ${ADMIN_EMAIL:-}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
      Email__SmtpHost: mail
      Email__SmtpPort: "1025"
      Email__UseStartTls: "false"
      Email__FromAddress: no-reply@portfolio.test
      Contact__NotifyEmail: ${NOTIFY_EMAIL:-}
      DataProtection__KeysPath: /app/keys
      Analytics__Secret: ${ANALYTICS_SECRET:-}
      GitHub__Token: ${GITHUB_TOKEN:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/wwwroot/uploads
      - keys:/app/keys

volumes:
  pgdata:
  uploads:
  keys:
