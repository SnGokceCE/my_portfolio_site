# Geliştirme:  docker compose up -d db      (sadece veritabanı; uygulamayı `dotnet run` ile çalıştır)
# Tam yığın:   docker compose up --build    (veritabanı + web uygulaması, http://localhost:8080)
name: portfolio

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portfolio_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: src/Portfolio.Web/Dockerfile
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Port=5432;Database=portfolio;Username=portfolio;Password=${POSTGRES_PASSWORD:-portfolio_dev}"
      Seed__AdminEmail: ${ADMIN_EMAIL:-}
      Seed__AdminPassword: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/wwwroot/uploads

volumes:
  pgdata:
  uploads:
